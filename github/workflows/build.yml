name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with: { distribution: 'zulu', java-version: '17' }
    - run: gradle wrapper && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v3
      with: { name: Darkness-APK, path: app/build/outputs/apk/debug/app-debug.apk }
